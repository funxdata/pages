name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish JSR + S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          deno_version=$(node -p "require('./deno.json').version")
          dytes_version=$(node -p "require('./dytes.json').version")
          if [ "${deno_version}" != "${dytes_version}" ]; then
            echo "deno.json (${deno_version}) 与 dytes.json (${dytes_version}) 版本不一致" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "${deno_version}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与版本 ${deno_version} 不一致" >&2
            exit 1
          fi

      - name: Publish to JSR
        run: deno publish --allow-slow-types
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}

      - name: Build assets
        run: |
          deno task pack ./router/router.ts
          deno task pack ./tpls/browser.ts

      - name: Publish to S3
        uses: dytescn/dytes@v0.1.9
        with:
          command: publish
          args: --force
