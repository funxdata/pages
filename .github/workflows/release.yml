name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish JSR + S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish to JSR
        run: deno publish --allow-slow-types

      - name: Build assets
        run: |
          deno task pack ./router/router.ts
          deno task pack ./tpls/browser.ts

      - name: Publish to S3
        uses: dytescn/dytes@v0.1.9
        with:
          command: publish
          args: --force
